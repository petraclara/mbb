<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="{{url}}" />
  <meta name="theme-color" content="#0a2a5e" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mentorship Beyond Boundaries" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{url}}" />
  <meta property="og:image" content="{{site}}/assets/img/logo.jpg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="{{site}}/assets/img/logo.jpg" />

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
{{header}}
<main id="main">
{{content}}
</main>
{{footer}}
<script src="assets/js/config.js"></script>
<script src="assets/js/main.js" defer></script>
</body>
</html>
